name: Ligar-Meu-PC

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Instalar Interface Grafica e Ngrok
      run: |
        sudo apt-get update
        sudo apt-get install -y xfce4 xfce4-goodies tightvncserver
        # Instalação direta do Ngrok via script oficial do fabricante
        curl -s https://amazonaws.com | sudo tee /usr/share/keyrings/ngrok.asc >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/ngrok.asc] https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update
        sudo apt-get install -y ngrok
    - name: Conectando a Chave
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        mkdir -p ~/.vnc
        echo "123456" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        vncserver :1 -geometry 1280x720 -depth 24
    - name: Mostrar Link do PC
      run: |
        ngrok tcp 5901 --log=stdout > ngrok.log &
        sleep 5
        curl -s http://127.0.0 | grep -o 'tcp://[^"]*'
    - name: Manter PC Ligado
      run: sleep 21600
